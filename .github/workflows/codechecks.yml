name: Code checks

on:
    push:
        branches: [main]
    pull_request:

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/setup@v2
              with:
                  runtime: node@24
            - run: pnpm typecheck
            - run: pnpm lint
            - run: pnpm format
