x-logging: &default-logging
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  sqld:
    image: ghcr.io/tursodatabase/libsql-server:latest
    logging: *default-logging
    volumes: [ "sqld-data:/var/lib/sqld" ]
    restart: unless-stopped
    healthcheck:
        test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080" ]
        interval: 5s
        timeout: 3s
        retries: 10
        start_period: 5s

  migrate:
      image: ghcr.io/jstmemit/migrate
      logging: *default-logging
      build:
          context: .
          dockerfile: packages/db/Dockerfile
      env_file:
          - ".env.docker"
      depends_on:
          sqld:
              condition: service_healthy
      restart: "no"

  redis:
    image: redis:alpine
    logging: *default-logging
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes: [ "redis-data:/data" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  bot:
    image: ghcr.io/jstmemit/bot
    init: true
    logging: *default-logging
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    env_file:
      - ".env.docker"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      sqld:
        condition: service_started

  website:
      image: ghcr.io/jstmemit/website
      init: true
      logging: *default-logging
      build:
          context: .
          dockerfile: apps/website/Dockerfile
      restart: unless-stopped
      ports: [ "4321:4321" ]

  meme-generator:
    image: ghcr.io/jstmemit/meme-generator
    init: true
    logging: *default-logging
    build:
      context: .
      dockerfile: apps/meme-generator/Dockerfile
    environment:
        - UV_THREADPOOL_SIZE=8
    env_file:
      - ".env.docker"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      sqld:
        condition: service_started

  whisper:
      image: hwdsl2/whisper-server
      logging: *default-logging
      container_name: whisper
      restart: unless-stopped
      deploy:
          resources:
              limits: { cpus: "2", memory: 4g }
      volumes:
          - whisper-data:/var/lib/whisper
          - ./.env.docker:/whisper.env:ro

volumes:
  sqld-data:
  redis-data:
  whisper-data:
      name: whisper-data